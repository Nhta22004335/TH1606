<!DOCTYPE html>
<html lang="vi" class="bg-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1505691723518-36a5ac3be353?auto=format&fit=crop&w=1350&q=80');">

<div class="bg-white shadow-lg rounded-2xl w-full max-w-md">

    <div id="registrationFormContainer" class="px-6 py-6 sm:px-8 sm:py-8">
        <div class="flex justify-center">
            <img src="../../../public/images/datviet.png" alt="Logo" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-center text-blue-600 mt-4 mb-6">Tạo tài khoản mới</h1>

        <form id="registrationForm" class="space-y-4" novalidate>
            <div>
                <label for="hoten" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                <input type="text" id="hoten" name="hoten" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:border-blue-400" 
                    placeholder="Nguyễn Văn An" oninput="sinhTenDangNhap()">
            </div>
            <div>
                <label for="tendangnhap" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập (tự sinh)</label>
                <input type="text" id="tendangnhap" name="tendangnhap" readonly 
                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="text" id="email" name="email" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:border-blue-400" 
                    placeholder="example@email.com">
            </div>
            <div>
                <label for="sodienthoai" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                <input type="text" id="sodienthoai" name="sodienthoai" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:border-blue-400" 
                    placeholder="09xxxxxxxx">
            </div>
            <div>
                <label for="matkhau" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="matkhau" name="matkhau"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:border-blue-400">
            </div>
            <div>
                <label for="matkhaunhaplai" class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
                <input type="password" id="matkhaunhaplai" name="matkhaunhaplai" 
                    class="w-full px-4 py-2 border rounded-lg focus:ring-1 focus:border-blue-400">
            </div>
            
            <button type="button" onclick="validateAndSubmit()"
                class="w-full py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400">
                Lấy mã OTP
            </button>
            <div id="thongbaoDangKy" class="mt-2 text-center text-sm"></div>
        </form>
    </div>
</div>

<script>
function sinhTenDangNhap() {
    const hoten = document.getElementById('hoten').value;
    const tendangnhap = document.getElementById('tendangnhap');
    if (!hoten) { tendangnhap.value = ''; return; }
    const clean = hoten.trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
    const parts = clean.split(/\s+/).filter(Boolean);
    if (parts.length < 2) { tendangnhap.value = parts[0] || ''; return; }
    const ten = parts[parts.length - 1];
    const ho = parts[0].charAt(0);
    const lot = parts.slice(1, -1).map(p => p.charAt(0)).join('');
    tendangnhap.value = ten + ho + lot;
}

function hienThiThongBao(message, isSuccess = false) {
    const div = document.getElementById('thongbaoDangKy');
    div.textContent = message;
    div.className = isSuccess ? 'mt-2 text-center text-sm text-green-600' : 'mt-2 text-center text-sm text-red-600';
}

async function validateAndSubmit() {
    console.log("🔥 VALIDATE START"); // DEBUG
    
    const hoten = document.getElementById('hoten').value.trim();
    const email = document.getElementById('email').value.trim();
    const sdt = document.getElementById('sodienthoai').value.trim();
    const matkhau = document.getElementById('matkhau').value.trim();
    const matkhaunhaplai = document.getElementById('matkhaunhaplai').value.trim();
    const btn = event.target;
    
    // RỖNG
    if (!hoten || !email || !sdt || !matkhau || !matkhaunhaplai) {
        hienThiThongBao('❌ Vui lòng điền đầy đủ các trường bắt buộc!');
        return;
    }
    
    // EMAIL
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        hienThiThongBao('❌ Email không hợp lệ!');
        return;
    }
    
    // SĐT
    if (!/^(0[0-9]{9})$/.test(sdt)) {
        hienThiThongBao('❌ Số điện thoại không hợp lệ!');
        return;
    }
    
    // MẬT KHẨU KHỚP
    if (matkhau !== matkhaunhaplai) {
        hienThiThongBao('❌ Mật khẩu nhập lại không khớp!');
        return;
    }
    
    // 🔥 MẬT KHẨU MẠNH - REGEX MỚI ĐƠN GIẢN HƠN
    console.log("🔑 Testing password:", matkhau); // DEBUG
    if (!/^.{8,}$/.test(matkhau)) {
        hienThiThongBao('❌ Mật khẩu phải ≥ 8 ký tự!');
        return;
    }
    if (!/[a-z]/.test(matkhau)) {
        hienThiThongBao('❌ Mật khẩu cần ít nhất 1 chữ thường!');
        return;
    }
    if (!/[A-Z]/.test(matkhau)) {
        hienThiThongBao('❌ Mật khẩu cần ít nhất 1 chữ HOA!');
        return;
    }
    if (!/\d/.test(matkhau)) {
        hienThiThongBao('❌ Mật khẩu cần ít nhất 1 số!');
        return;
    }
    if (!/[\W_]/.test(matkhau)) {
        hienThiThongBao('❌ Mật khẩu cần ít nhất 1 ký tự đặc biệt!');
        return;
    }
    
    console.log("✅ ALL VALIDATE OK");
    
    // GỬI
    hienThiThongBao('');
    btn.disabled = true;
    btn.textContent = 'Đang gửi...';
    
    const formData = new FormData();
    formData.append('hoten', hoten);
    formData.append('tendangnhap', document.getElementById('tendangnhap').value);
    formData.append('email', email);
    formData.append('sodienthoai', sdt);
    formData.append('matkhau', matkhau);
    
    try {
        const response = await fetch('../../models/auth/xuly_dangky.php', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        if (data.success) {
            hienThiThongBao('✅ Gửi mã OTP thành công! Kiểm tra email.', true);
        } else {
            hienThiThongBao('❌ ' + (data.message || 'Đăng ký thất bại!'));
        }
    } catch (error) {
        hienThiThongBao('❌ Lỗi kết nối!');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Lấy mã OTP';
    }
}
</script>

</body>
</html>
