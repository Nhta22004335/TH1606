<!DOCTYPE html>
<html lang="vi" class="bg-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1505691723518-36a5ac3be353?auto=format&fit=crop&w=1350&q=80');">

<div class="bg-white shadow-lg rounded-2xl w-full max-w-md">

    <!-- FORM ĐĂNG KÝ -->
    <div id="registrationFormContainer" class="px-6 py-6 sm:px-8 sm:py-8">
        <div class="flex justify-center">
            <img src="../../../public/images/datviet.png" alt="Logo" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-center text-blue-600 mt-4 mb-6">Tạo tài khoản mới</h1>

        <form id="registrationForm" class="space-y-4" novalidate>
            <div>
                <label for="hoten" class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                <input type="text" id="hoten" name="hoten" autocomplete="name" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-1 focus:border-blue-400" placeholder="Nguyễn Văn An" required>
                <div id="hotenCheck" class="mt-1 text-xs"></div>
            </div>
            <div>
                <label for="tendangnhap" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập (tự sinh)</label>
                <input type="text" id="tendangnhap" name="tendangnhap" autocomplete="username" readonly class="w-full px-4 py-2 outline-none border rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-1 focus:border-blue-400" placeholder="example@email.com" required>
                <div id="emailCheck" class="mt-1 text-xs"></div>
            </div>
            <div>
                <label for="sodienthoai" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                <input type="tel" id="sodienthoai" name="sodienthoai" autocomplete="tel" class="w-full px-4 py-2 border outline-none rounded-lg focus:ring-1 focus:border-blue-400" placeholder="09xxxxxxxx" required>
                <div id="sdtCheck" class="mt-1 text-xs"></div>
            </div>
            <div>
                <label for="matkhau" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="matkhau" name="matkhau" autocomplete="new-password" class="w-full px-4 py-2 border outline-none rounded-lg focus:ring-1 focus:border-blue-400" required>
            </div>
            <div>
                <label for="matkhaunhaplai" class="block text-sm font-medium text-gray-700 mb-1">Nhập lại mật khẩu</label>
                <input type="password" id="matkhaunhaplai" name="matkhaunhaplai" autocomplete="new-password" class="w-full px-4 py-2 outline-none border rounded-lg focus:ring-1 focus:border-blue-400" required>
                <div id="matkhaunhaplaiCheck" class="mt-1 text-xs"></div>
            </div>
            <button id="btnDangKy" type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:bg-gray-400">
                Lấy mã OTP
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            Đã có tài khoản? <a href="dangnhap.html" class="text-blue-600 hover:text-blue-800 font-medium">Đăng nhập ngay</a>
        </p>
        <div id="thongbaoDangKy" class="mt-2 text-center text-sm"></div>
    </div>

    <!-- FORM OTP -->
    <div id="otpFormContainer" class="px-6 py-8 sm:px-8 sm:py-10 hidden">
        <h1 class="text-xl sm:text-2xl font-bold text-center text-blue-600 mb-4">Xác thực tài khoản</h1>
        <p class="text-center text-sm text-gray-600 mb-6">
            Mã OTP đã được gửi đến email <strong id="otpEmailDisplay"></strong>. Vui lòng nhập mã để hoàn tất.
        </p>
        <form id="otpForm" autocomplete="off">
            <input type="hidden" id="otpEmail" name="email" autocomplete="off">
            <div class="mb-4">
                <label for="otp" class="block text-sm font-medium text-gray-700 mb-1">Mã OTP</label>
                <input type="text" id="otp" name="otp" autocomplete="off" class="w-full text-center outline-none tracking-[0.8em] text-2xl font-bold px-4 py-2 border rounded-lg focus:ring focus:border-blue-400" maxlength="6" inputmode="numeric" required>
            </div>
            <button id="btnXacNhan" type="submit" class="w-full py-2 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 disabled:bg-gray-400">
                Xác nhận & Tạo tài khoản
            </button>
            <div id="thongbaoOTP" class="mt-2 text-center text-sm"></div>
        </form>
    </div>

</div>

<script>
    // --- Lấy các phần tử DOM ---
    const registrationFormContainer = document.getElementById('registrationFormContainer');
    const otpFormContainer = document.getElementById('otpFormContainer');
    const registrationForm = document.getElementById('registrationForm');
    const otpForm = document.getElementById('otpForm');
    const btnDangKy = document.getElementById('btnDangKy');
    const btnXacNhan = document.getElementById('btnXacNhan');
    const thongbaoDangKy = document.getElementById('thongbaoDangKy');
    const thongbaoOTP = document.getElementById('thongbaoOTP');

    const inputHoTen = document.getElementById('hoten');
    const inputTenDangNhap = document.getElementById('tendangnhap');
    const inputEmail = document.getElementById('email');
    const inputSDT = document.getElementById('sodienthoai');
    const inputMatKhau = document.getElementById('matkhau');
    const inputNhapLai = document.getElementById('matkhaunhaplai');

    const msgEmail = document.getElementById('emailCheck');
    const msgSDT = document.getElementById('sdtCheck');
    const msgMatKhau = document.getElementById('matkhaunhaplaiCheck');

    // --- CÁC HÀM TIỆN ÍCH ---
    function hienThiThongBao(element, message, isSuccess = false) {
        element.textContent = message;
        element.className = isSuccess ? 'mt-1 text-xs text-green-600' : 'mt-1 text-xs text-red-600';
    }

    function chuanHoaChuoi(str) {
        return str.trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
    }

    function sinhTenDangNhap() {
        const parts = chuanHoaChuoi(inputHoTen.value).split(/\s+/).filter(Boolean);
        if (parts.length < 2) { inputTenDangNhap.value = parts[0] || ''; return; }
        const ten = parts[parts.length - 1];
        const ho = parts[0].charAt(0);
        const lot = parts.slice(1, -1).map(p => p.charAt(0)).join('');
        inputTenDangNhap.value = ten + ho + lot;
    }

    // --- VALIDATION REALTIME ---
    inputHoTen.addEventListener('input', sinhTenDangNhap);

    function checkMatKhau() {
        const mk = inputMatKhau.value.replace(/\s/g, '');
        const mk2 = inputNhapLai.value.replace(/\s/g, '');
        if (!mk2) { msgMatKhau.textContent = ''; return; }
        if (mk === mk2) hienThiThongBao(msgMatKhau, '✅ Mật khẩu khớp!', true);
        else hienThiThongBao(msgMatKhau, '❌ Mật khẩu không khớp!');
    }
    inputMatKhau.addEventListener('input', checkMatKhau);
    inputNhapLai.addEventListener('input', checkMatKhau);

    inputEmail.addEventListener('input', () => {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!inputEmail.value) msgEmail.textContent = '';
        else if (re.test(inputEmail.value)) hienThiThongBao(msgEmail, 'Email hợp lệ', true);
        else hienThiThongBao(msgEmail, 'Email không hợp lệ');
    });

    inputSDT.addEventListener('input', () => {
        const re = /^(0[0-9]{9})$/;
        if (!inputSDT.value) msgSDT.textContent = '';
        else if (re.test(inputSDT.value)) hienThiThongBao(msgSDT, 'Số điện thoại hợp lệ', true);
        else hienThiThongBao(msgSDT, 'Số điện thoại không hợp lệ');
    });

    // --- XỬ LÝ FORM ĐĂNG KÝ ---
    registrationForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const hoten = inputHoTen.value.trim();
        const email = inputEmail.value.trim();
        const sdt = inputSDT.value.trim();
        const matkhau = inputMatKhau.value.trim();
        const matkhaunhaplai = inputNhapLai.value.trim();
        const checkDiv = msgMatKhau.textContent;

        // Kiểm tra rỗng
        if (!hoten || !email || !sdt || !matkhau || !matkhaunhaplai) {
            hienThiThongBao(thongbaoDangKy, '❌ Vui lòng điền đầy đủ các trường bắt buộc!');
            return;
        }

        // Kiểm tra email
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            hienThiThongBao(thongbaoDangKy, '❌ Email không hợp lệ!');
            return;
        }

        // Kiểm tra số điện thoại
        if (!/^(0[0-9]{9})$/.test(sdt)) {
            hienThiThongBao(thongbaoDangKy, '❌ Số điện thoại không hợp lệ!');
            return;
        }

        // Kiểm tra mật khẩu khớp
        if (checkDiv.includes('❌ Mật khẩu không khớp!') || matkhau !== matkhaunhaplai) {
            hienThiThongBao(thongbaoDangKy, '❌ Mật khẩu nhập lại không khớp!');
            return;
        }

        // Kiểm tra độ mạnh mật khẩu
        if (!/^.{8,}$/.test(matkhau)) {
            hienThiThongBao(thongbaoDangKy, '❌ Mật khẩu phải ≥ 8 ký tự!');
            return;
        }
        if (!/[a-z]/.test(matkhau)) {
            hienThiThongBao(thongbaoDangKy, '❌ Mật khẩu cần ít nhất 1 chữ thường!');
            return;
        }
        if (!/[A-Z]/.test(matkhau)) {
            hienThiThongBao(thongbaoDangKy, '❌ Mật khẩu cần ít nhất 1 chữ HOA!');
            return;
        }
        if (!/\d/.test(matkhau)) {
            hienThiThongBao(thongbaoDangKy, '❌ Mật khẩu cần ít nhất 1 số!');
            return;
        }
        if (!/[\W_]/.test(matkhau)) {
            hienThiThongBao(thongbaoDangKy, '❌ Mật khẩu cần ít nhất 1 ký tự đặc biệt!');
            return;
        }

        // Gửi request
        btnDangKy.disabled = true;
        btnDangKy.textContent = 'Đang gửi...';
        hienThiThongBao(thongbaoDangKy, '');

        const formData = new FormData(this);

        fetch('../../models/auth/xuly_dangky.php', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.success) {
                // Lưu email vào localStorage
                localStorage.setItem('otpEmail', email);
                // Chuyển sang form OTP
                registrationFormContainer.classList.add('hidden');
                otpFormContainer.classList.remove('hidden');
                document.getElementById('otpEmailDisplay').textContent = email;
                document.getElementById('otpEmail').value = email;
                hienThiThongBao(thongbaoOTP, '✅ Mã OTP đã được gửi! Kiểm tra email.', true);
            } else {
                hienThiThongBao(thongbaoDangKy, '❌ ' + (data.message || 'Đăng ký thất bại!'));
            }
        })
        .catch(error => {
            console.error('Lỗi:', error);
            hienThiThongBao(thongbaoDangKy, '❌ Lỗi kết nối hoặc server không phản hồi!');
        })
        .finally(() => {
            btnDangKy.disabled = false;
            btnDangKy.textContent = 'Lấy mã OTP';
        });
    });

    // --- XỬ LÝ FORM OTP ---
    otpForm.addEventListener('submit', function(e) {
        e.preventDefault();

        btnXacNhan.disabled = true;
        btnXacNhan.textContent = 'Đang xác nhận...';
        hienThiThongBao(thongbaoOTP, '');

        const formData = new FormData(this);

        fetch('../../models/auth/xacnhan_otp_dk.php', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.success) {
                hienThiThongBao(thongbaoOTP, data.message, true);
                // Xóa trạng thái sau khi hoàn tất
                localStorage.removeItem('otpEmail');
                setTimeout(() => window.location.href = 'dangnhap.html', 2000);
            } else {
                hienThiThongBao(thongbaoOTP, data.message);
            }
        })
        .catch(error => {
            console.error('Lỗi:', error);
            hienThiThongBao(thongbaoOTP, '❌ Lỗi kết nối. Vui lòng thử lại.');
        })
        .finally(() => {
            btnXacNhan.disabled = false;
            btnXacNhan.textContent = 'Xác nhận & Tạo tài khoản';
        });
    });

    // --- KIỂM TRA TRẠNG THÁI KHI TẢI LẠI TRANG ---
    window.addEventListener('load', () => {
        const savedEmail = localStorage.getItem('otpEmail');
        if (savedEmail) {
            registrationFormContainer.classList.add('hidden');
            otpFormContainer.classList.remove('hidden');
            document.getElementById('otpEmailDisplay').textContent = savedEmail;
            document.getElementById('otpEmail').value = savedEmail;
            hienThiThongBao(thongbaoOTP, '✅ Mã OTP đã được gửi trước đó. Vui lòng nhập mã.', true);
        }
    });
</script>
</body>
</html>
