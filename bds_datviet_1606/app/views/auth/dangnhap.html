<!DOCTYPE html>
<html lang="vi" class="bg-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen w-screen bg-cover bg-center flex items-center justify-center"
  style="background-image: url('https://images.unsplash.com/photo-1505691723518-36a5ac3be353?auto=format&fit=crop&w=1350&q=80');">

<div class="bg-white shadow-lg rounded-2xl w-full max-w-md px-6 py-6 sm:px-8 sm:py-10">
    <div class="flex justify-center">
        <img src="../../../public/images/datviet.png" alt="Logo hệ thống" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
    </div>

    <p class="text-center text-gray-500 italic text-sm sm:text-base mb-4">Không gian sống lý tưởng cho bạn</p>

    <h1 class="text-xl sm:text-2xl font-bold text-center text-blue-600 mb-6">Đăng nhập hệ thống</h1>

    <form id="loginForm">
        <div class="mb-4">
            <label for="tendangnhap" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
            <input type="text" id="tendangnhap" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring focus:border-blue-400 transition text-sm sm:text-base" placeholder="Nhập tên đăng nhập" required>
        </div>

        <div class="mb-4">
            <label for="matkhau" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
            <input type="password" id="matkhau" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring focus:border-blue-400 transition text-sm sm:text-base" placeholder="Nhập mật khẩu" required>
        </div>

        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember" class="mr-2 rounded">
                <label for="remember" class="text-sm text-gray-600">Ghi nhớ đăng nhập</label>
            </div>
            <a href="caidat_matkhau.html" class="text-sm text-blue-600 hover:text-blue-800 font-medium">Quên mật khẩu?</a>
        </div>
        
        <button id="btnDangNhap" type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition text-sm sm:text-base disabled:bg-gray-400">
            Đăng nhập
        </button>

        <div id="thongbao" class="mt-4 text-center text-sm"></div>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
        Chưa có tài khoản?
        <a href="dangky.html" class="text-blue-600 hover:text-blue-800 font-medium">Đăng ký ngay</a>
    </p>

    <p class="text-center text-xs text-gray-400 mt-6">© 2025 Zolux 4335. All rights reserved.</p>
</div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const btnDangNhap = document.getElementById('btnDangNhap');
    const thongbaoDiv = document.getElementById('thongbao');
    const inputMatkhau = document.getElementById('matkhau');

    /**
     * SỬA 3: Hàm hiển thị thông báo
     * @param {string} message - Nội dung thông báo
     * @param {boolean} isSuccess - true nếu là thành công (màu xanh), false nếu là lỗi (màu đỏ)
     */
    function hienThiThongBao(message, isSuccess = false) {
        thongbaoDiv.textContent = message;
        thongbaoDiv.className = isSuccess 
            ? 'mt-4 text-center text-sm text-green-600' 
            : 'mt-4 text-center text-sm text-red-600';
    }

    // SỬA 2: Loại bỏ hoàn toàn các hàm chuẩn hóa tên đăng nhập không cần thiết
    // Tên đăng nhập sẽ được gửi đi y như người dùng nhập.

    loginForm.addEventListener('submit', function(event) {
        event.preventDefault(); // Ngăn form gửi đi theo cách truyền thống

        const tendangnhap = document.getElementById('tendangnhap').value.trim();
        const matkhau = inputMatkhau.value;
        const remember = document.getElementById('remember').checked; // Lấy giá trị checkbox "Ghi nhớ"

        if (matkhau === "" || tendangnhap === "") {
            hienThiThongBao('Vui lòng nhập đầy đủ thông tin!');
            return;
        }

        // SỬA 4: Vô hiệu hóa nút và xóa thông báo cũ
        btnDangNhap.disabled = true;
        btnDangNhap.textContent = 'Đang xử lý...';
        hienThiThongBao(''); // Xóa thông báo cũ

        fetch('../../models/auth/xuly_dangnhap.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                tendangnhap: tendangnhap, 
                matkhau: matkhau,
                remember: remember // Gửi trạng thái "Ghi nhớ" lên server
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Lỗi mạng hoặc máy chủ.');
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                hienThiThongBao(data.message, true);
                // Chuyển hướng sau một khoảng trễ ngắn để người dùng đọc được thông báo
                setTimeout(() => {
                    window.location.href = '../../../index.php';
                }, 1000);
            } else {
                hienThiThongBao(data.message, false);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            hienThiThongBao('Đã xảy ra lỗi kết nối. Vui lòng thử lại.');
        })
        .finally(() => {
            // Luôn kích hoạt lại nút bấm sau khi xử lý xong
            btnDangNhap.disabled = false;
            btnDangNhap.textContent = 'Đăng nhập';
        });
    });
  </script>
</body>
</html>
