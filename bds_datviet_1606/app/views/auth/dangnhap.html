<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="h-screen w-screen bg-cover bg-center flex items-center justify-center" style="background-image: url('https://images.unsplash.com/photo-1505691723518-36a5ac3be353?auto=format&fit=crop&w=1350&q=80');">

    <div class="bg-white shadow-lg rounded-2xl w-full max-w-md px-6 py-6 sm:px-6 sm:py-6">
        
        <div class="flex justify-center">
            <img src="../../../public/images/datviet.png" alt="Logo hệ thống" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
        </div>
        <p class="text-center text-gray-500 italic text-sm sm:text-sm mb-2">Không gian sống lý tưởng cho bạn</p>
        <h1 class="text-xl sm:text-2xl font-bold text-center text-blue-600 mb-6">Đăng nhập hệ thống</h1>

        <form id="loginForm">
            <div class="mb-4">
                <label for="tendangnhap" class="block text-sm font-medium text-gray-500 mb-1">Tên đăng nhập</label>
                <input type="text" id="tendangnhap" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-0 focus:border-blue-400 transition text-sm sm:text-base" placeholder="Nhập tên đăng nhập" autocomplete="off">
            </div>

            <div class="mb-4 relative">
                <label for="matkhau" class="block text-sm font-medium text-gray-500 mb-1">Mật khẩu</label>
                <input type="password" id="matkhau" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-0 focus:border-blue-400 transition text-sm sm:text-base pr-10" placeholder="Nhập mật khẩu" autocomplete="off">
                <span id="togglePassword" class="absolute right-3 top-8 cursor-pointer text-gray-400 hover:text-gray-500 select-none">
                    <i class="fa-solid fa-eye text-lg"></i>
                </span>
            </div>

            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="mr-2 rounded">
                    <label for="remember" class="text-sm text-gray-600">Ghi nhớ đăng nhập</label>
                </div>
                <a href="caidat_matkhau.html" class="text-sm text-blue-600 hover:text-blue-800 font-medium">Quên mật khẩu?</a>
            </div>
            
            <button id="btnDangNhap" type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition text-sm sm:text-base disabled:bg-gray-400">
                Đăng nhập
            </button>

            <div id="thongbao" class="mt-4 text-center text-sm"></div>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            Chưa có tài khoản?
            <a href="dangky.html" class="text-blue-600 hover:text-blue-800 font-medium">Đăng ký ngay</a>
        </p>

        <p class="text-center text-xs text-gray-400 mt-4">© 2025 Đất Việt BDS. Quản trị BĐS: Minh bạch, Hiệu quả, Tăng trưởng.</p>
    </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const btnDangNhap = document.getElementById('btnDangNhap');
    const thongbaoDiv = document.getElementById('thongbao');
    const inputMatkhau = document.getElementById('matkhau');

    function hienThiThongBao(message, isSuccess = false) {
        thongbaoDiv.textContent = message;
        thongbaoDiv.className = isSuccess 
            ? 'mt-4 text-center text-sm text-green-600' 
            : 'mt-4 text-center text-sm text-red-600';
    }

    loginForm.addEventListener('submit', function(event) {
        event.preventDefault(); 

        const tendangnhap = document.getElementById('tendangnhap').value.trim();
        const matkhau = inputMatkhau.value;
        const remember = document.getElementById('remember').checked; 

        if (matkhau === "" || tendangnhap === "") {
            hienThiThongBao('Vui lòng nhập đầy đủ thông tin!');
            return;
        }

        btnDangNhap.disabled = true;
        btnDangNhap.textContent = 'Đang xử lý...';
        hienThiThongBao(''); 

        fetch('../../models/auth/xuly_dangnhap.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                tendangnhap: tendangnhap, 
                matkhau: matkhau,
                remember: remember 
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Lỗi mạng hoặc máy chủ.');
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                hienThiThongBao(data.message, true);
                setTimeout(() => {
                    window.location.href = '../../../index.php';
                }, 1000);
            } else {
                hienThiThongBao(data.message, false);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            hienThiThongBao('Đã xảy ra lỗi kết nối. Vui lòng thử lại.');
        })
        .finally(() => {
            btnDangNhap.disabled = false;
            btnDangNhap.textContent = 'Đăng nhập';
        });
    });
 
    const mk = document.getElementById('matkhau');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
        const icon = toggle.querySelector('i');
        const isPasswordHidden = mk.type === 'password';

        mk.type = isPasswordHidden ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !isPasswordHidden);
        icon.classList.toggle('fa-eye-slash', isPasswordHidden);
    });

    // Danh sách các sự kiện cần chặn
    ['copy', 'paste', 'cut', 'drag', 'drop'].forEach(evt => {
        inputMatKhau.addEventListener(evt, e => e.preventDefault());
    });
</script>
</body>
</html>
